server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # En-têtes de durcissement. Pas de Content-Security-Policy ici : Blazor WASM exige 'wasm-unsafe-eval' et MudBlazor
    # des styles en ligne, et l'adresse de l'API est choisie au démarrage (API_BASE_URL) ; la CSP se règle au déploiement.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Application monopage : toute route inconnue retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # La configuration est générée au démarrage du conteneur : ne jamais la mettre en cache.
    location = /appsettings.json {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always; # add_header d'un bloc remplace ceux du serveur
        add_header X-Frame-Options "DENY" always;
    }
}
