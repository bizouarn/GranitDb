server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # En-têtes de durcissement (dont la Content-Security-Policy) : fichier écrit au démarrage du conteneur par
    # docker-entrypoint.sh, car l'adresse de l'API (connect-src) vient de API_BASE_URL. Un add_header placé dans un bloc
    # location remplace ceux du serveur : chaque bloc qui en pose un réinclut donc le fichier.
    include /etc/nginx/security-headers.conf;

    # Application monopage : toute route inconnue retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Le point d'entrée, l'enregistrement du service worker et son manifeste ne doivent jamais être servis d'un cache périmé :
    # sans cela le navigateur garde l'ancienne version de l'application (index.html d'avant, qui pointe vers d'anciens fichiers).
    location ~ ^/(index.html|service-worker.js|service-worker-assets.js|manifest.webmanifest|css/.*|js/.*)$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # La configuration est générée au démarrage du conteneur : ne jamais la mettre en cache.
    location = /appsettings.json {
        add_header Cache-Control "no-store";
        include /etc/nginx/security-headers.conf;
    }
}
