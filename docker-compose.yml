# Démarrage en une commande, sans serveur de base de données (catalogue SQLite) :
#   docker compose up --build        -> interface http://localhost:8081, API http://localhost:5105/swagger
#
# Avec SQL Server comme catalogue (voir .env.example) :
#   docker compose --profile sqlserver up --build
services:
  api:
    restart: on-failure
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "5105:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Catalog__Provider: ${CATALOG_PROVIDER:-Sqlite}
      Catalog__ConnectionString: ${CATALOG_CONNECTION_STRING:-}
      # Autorise l'API à se connecter à un serveur SQL Server choisi depuis l'interface (voir le README : à n'ouvrir qu'à des personnes de confiance).
      Catalog__AllowSqlServerSources: ${ALLOW_SQLSERVER_SOURCES:-true}
      # Profilage des colonnes (comptes de lignes, nuls et valeurs distinctes calculés par la source, administrateurs) : ALLOW_PROFILING=true pour l'activer.
      Catalog__AllowProfiling: ${ALLOW_PROFILING:-false}
      # Assistant d'IA (modèle léger local, profil « ai ») : ALLOW_AI=true pour l'activer. AllowRemote : le service ollama est sur le réseau Docker, en clair.
      Catalog__AllowAi: ${ALLOW_AI:-false}
      Ai__Endpoint: ${AI_ENDPOINT:-http://ollama:11434/v1}
      Ai__Model: ${AI_MODEL:-qwen3:4b-instruct}
      Ai__AllowRemote: ${AI_ALLOW_REMOTE:-true}
      # Authentification (voir « Authentification et rôles » du README) : désactivée par défaut. Pour l'activer, AUTH_ENABLED=true,
      # une OAuth App GitHub (adresse de retour http://localhost:5105/auth/callback/github) et le login du premier administrateur.
      Auth__Enabled: ${AUTH_ENABLED:-false}
      Auth__GitHub__ClientId: ${GITHUB_CLIENT_ID:-}
      Auth__GitHub__ClientSecret: ${GITHUB_CLIENT_SECRET:-}
      Auth__Roles__Admins__0: ${AUTH_FIRST_ADMIN:-}
      # Origine de l'interface, autorisée à appeler l'API avec les cookies de session.
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-http://localhost:8081}
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    # Permet d'atteindre un SQL Server du poste hôte avec « host.docker.internal » (déjà vrai sous Docker Desktop, utile sous Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - granitdb-data:/data

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "8081:80"
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:5105/}
    depends_on:
      - api

  sqlserver:
    profiles: ["sqlserver"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Granit_Dev_Passw0rd}
    volumes:
      - sqlserver-data:/var/opt/mssql

  # Assistant d'IA local (facultatif) : docker compose --profile ai up --build -d, avec ALLOW_AI=true (voir « Assistant d'IA » du README).
  # Un modèle léger (Qwen3 4B quantifié par défaut, ≈ 2,5 Go) tourne sur CPU ; il n'est pas dans l'image de l'API et se télécharge au premier démarrage.
  ollama:
    profiles: ["ai"]
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    # GPU NVIDIA (facultatif) : décommentez.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-pull:
    profiles: ["ai"]
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${AI_MODEL:-qwen3:4b-instruct}"]
    restart: "no"

volumes:
  granitdb-data:
  sqlserver-data:
  ollama-models:
