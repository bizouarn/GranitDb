name: CI

# La CI ne tourne que pour la branche main : un push sur main, ou une pull request qui la vise.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build et tests
    runs-on: ubuntu-latest
    env:
      # Docker est disponible sur les runners : les tests SQL Server (Testcontainers) doivent tourner, pas être ignorés.
      GRANITDB_REQUIRE_SQLSERVER: "1"
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GranitDb.sln

      - name: Build (api, client, tests)
        run: dotnet build GranitDb.sln -c Release --no-restore

      - name: Tests
        run: dotnet test tests/GranitDb.Tests -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Résultats des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/GranitDb.Tests/TestResults/*.trx

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Image de l'API
        run: docker build -f api/Dockerfile -t granitdb-api .

      - name: Image du client
        run: docker build -f client/Dockerfile -t granitdb-client .

      - name: Démarrage en une commande (catalogue SQLite, sans serveur)
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5105/DatabaseInfo; then echo; break; fi
            sleep 2
          done
          curl -fs http://localhost:5105/DatabaseInfo | grep -qx '\[\]'
          curl -fs http://localhost:8081/appsettings.json
          curl -fs -o /dev/null http://localhost:8081/databases/anything

      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs

      - name: Arrêt
        if: always()
        run: docker compose down -v
